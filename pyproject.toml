[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mantissa-perceptron"
version = "0.1.0"
description = "A minimal, fast binary perceptron on the mantissa C engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tekin Ertekin" }]
dependencies = [
    "numpy>=1.20",
    # Engine: kept in sync with MANTISSA_PIP_NAME in _engine.py. Now published
    # to PyPI, so this is a hard runtime dependency. A sibling mantissa/ dev
    # checkout is still picked up automatically when present.
    "mantissa-core>=0.2.1",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.5", "scikit-learn>=1.0"]
dev = ["pytest>=7", "matplotlib>=3.5", "scikit-learn>=1.0"]

[project.urls]
Homepage = "https://github.com/tekinertekin/mantissa-perceptron"
Engine = "https://github.com/tekinertekin/mantissa"

[tool.setuptools]
packages = ["mantissa_perceptron"]
